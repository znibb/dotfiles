- name: Install AUR package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: aur
  vars:
    pkg_update_cache: true
    pkg_packages:
      - streamcontroller # Stream Deck control software
      - kdotool # Window detection dependancy

- name: Ensure StreamController static config directory exists
  ansible.builtin.file:
    path: "{{ streamdeck_streamcontroller_static_config_dir }}"
    state: directory
    mode: '0755'

- name: Write StreamController static settings
  ansible.builtin.copy:
    content: |
      {
        "data-path": "{{ streamdeck_streamcontroller_config_dir }}"
      }
    dest: "{{ streamdeck_streamcontroller_static_config_dir }}/settings.json"
    mode: '0644'

- name: Find cv2 config-3.py in StreamController Python environment
  ansible.builtin.find:
    paths: /usr/local/lib/streamcontroller
    patterns: "config-3.py"
    recurse: true
  register: streamdeck_streamcontroller_cv2_config_files

- name: Disable cv2 Qt plugin path overrides to prevent system Qt5 apps (e.g. VLC) from crashing
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: 'ci_and_not_headless = ci_build and not headless'
    replace: 'ci_and_not_headless = False  # Disabled: bundled Qt plugins incompatible with system Qt5'
  loop: "{{ streamdeck_streamcontroller_cv2_config_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: streamdeck_streamcontroller_cv2_config_files.files | length > 0
  become: true
