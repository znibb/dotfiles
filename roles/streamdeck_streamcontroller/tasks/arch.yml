- name: Install AUR package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: aur
  vars:
    pkg_update_cache: true
    pkg_packages:
      - streamcontroller # Stream Deck control software
      - kdotool # Window detection dependancy

- name: Ensure StreamController static config directory exists
  ansible.builtin.file:
    path: "{{ streamdeck_streamcontroller_static_config_dir }}"
    state: directory
    mode: '0755'

- name: Write StreamController static settings
  ansible.builtin.copy:
    content: |
      {
        "data-path": "{{ streamdeck_streamcontroller_config_dir }}"
      }
    dest: "{{ streamdeck_streamcontroller_static_config_dir }}/settings.json"
    mode: '0644'

- name: Ensure user scripts and autostart directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ user_scripts_dir }}"
    - "{{ ansible_facts.env.HOME }}/.config/autostart"

- name: Symlink StreamController wrapper script
  ansible.builtin.file:
    src: "{{ role_path }}/files/streamcontroller.sh"
    dest: "{{ user_scripts_dir }}/streamcontroller.sh"
    state: link

- name: Create StreamController autostart entry
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.config/autostart/StreamController.desktop"
    content: |
      [Desktop Entry]
      Type=Application
      Name=StreamController
      Exec={{ user_scripts_dir }}/streamcontroller.sh -b
    mode: '0644'
