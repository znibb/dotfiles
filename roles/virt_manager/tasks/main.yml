- name: Install pacman package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: pacman
  vars:
    pkg_packages:
      - dnsmasq
      - libvirt
      - qemu-base
      - virt-manager
      - qemu-hw-usb-host # Needed for USB passthrough to guest

- name: OpenRC-specific
  ansible.builtin.include_tasks: "openrc.yml"
  when: ansible_service_mgr == 'openrc'

- name: Add user to libvirt group
  become: true
  ansible.builtin.user:
    append: true
    name: "{{ ansible_facts.user_id }}"
    groups:
      - libvirt
    state: present

- name: Start/enable libvirtd service
  become: true
  ansible.builtin.service:
    name: libvirtd
    enabled: true
    state: started
