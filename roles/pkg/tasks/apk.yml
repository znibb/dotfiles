- name: Install apk packages
  become: true
  community.general.apk:
    update_cache: "{{ pkg_update_cache | default(false) }}"
    name: "{{ packages }}"
    state: present
  register: pkg_output

# Debug output must run immediately after this specific install, not
# deferred/deduplicated at end of play with every other pkg role call.
- name: Show installed packages
  ansible.builtin.debug:
    msg: "{{ pkg_output.packages }}"
  when: pkg_output.changed  # noqa: no-handler
