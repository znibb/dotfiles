- name: Install pacman package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: pacman
  vars:
    pkg_packages:
      - cups # Printing
      - ghostscript
      - print-manager # KDE compatibility
      - system-config-printer # CUPS printer configuration

- name: OpenRC-specific
  ansible.builtin.include_tasks: "openrc.yml"
  when: ansible_service_mgr == 'openrc'

- name: Enable CUPS service
  become: true
  ansible.builtin.service:
    name: cupsd
    enabled: true
    state: started

- name: "Symlink scripts to {{ user_scripts_dir }}"
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "{{ user_scripts_dir }}/{{ item }}"
    state: link
  loop:
    - printer-setup.sh