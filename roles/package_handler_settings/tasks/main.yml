- name: Check for Artix-specific release file
  ansible.builtin.stat:
    path: /etc/artix-release
  register: package_handler_settings_artix_release

- name: Set fact if system is Artix
  ansible.builtin.set_fact:
    package_handler_settings_is_artix: true
    # Deliberately overriding the built-in ansible_distribution fact:
    # Artix's own fact value isn't what the rest of this repo's roles
    # check for, and 24+ role files key off this exact variable name
    # via `when: ansible_distribution | lower == ...`. Renaming it per
    # var-naming[no-role-prefix] would silently break distro detection
    # on Artix hosts everywhere else in the repo.
    ansible_distribution: "Artix Linux"  # noqa: var-naming[no-role-prefix]
  when: package_handler_settings_artix_release.stat.exists

- name: Artix-specific
  ansible.builtin.include_tasks: "artix.yml"
  when: ansible_distribution | lower == 'artix linux'

- name: Arch/Artix
  ansible.builtin.include_tasks: "arch.yml"
  when: ansible_distribution | lower == 'archlinux' or ansible_distribution | lower == 'artix linux'
