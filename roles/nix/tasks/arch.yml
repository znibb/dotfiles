- name: Install pacman package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: pacman
  vars:
    pkg_packages:
      - nix

- name: Install AUR package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: aur
  vars:
    pkg_update_cache: true
    pkg_packages:
      - zsh-nix-shell

