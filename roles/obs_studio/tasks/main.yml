- name: Install pacman package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: pacman
  vars:
    pkg_packages:
      - obs-studio
      - luajit # dependancy

- name: Install AUR package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: aur
  vars:
    pkg_packages:
      - obs-pipewire-audio-capture
