- name: Install pacman package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: pacman
  vars:
    packages:
      - librewolf

- name: Install AUR package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: aur
  vars:
    packages:
      - librewolf-extension-keepassxc-browser
