- name: Install pacman package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: pacman
  vars:
    pkg_packages:
      # Yay prereqs
      - base-devel

      # System
      - ansible
      - ansible-lint # ansible syntax checking
      - bat
      - btop
      - dnsutils # dig/nslookup
      - dosfstools # mkfs.vfat etc
      - dysk # `df` but better
      - fzf # fuzzy-finder
      - git
      - jq # command line JSON processor
      - man
      - ncdu # ncurses `du` frontend
      - net-tools # netstat etc
      - nfs-utils
      - openssh # ssh-keygen etc
      - powertop # power monitoring
      - python-pip
      - python-virtualenv
      - rsync
      - speedtest-cli
      - tldr
      - tree
      - ttf-meslo-nerd # Font for Starship prompt
      - usbutils # lsusb etc
      - vi # fallback for visudo etc
      - whois # mkpasswd etc
      - zip
      - unzip

- name: "Allow user to run passwordless pacman/yay: {{ ansible_facts.env.USER }}"
  become: true
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ ansible_facts.env.USER }}-pacman-yay"
    content: "{{ ansible_facts.env.USER }} ALL=(ALL) NOPASSWD: /usr/bin/pacman, /usr/bin/yay"
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: Check for yay binary
  ansible.builtin.stat:
    path: "/usr/bin/{{ aur_helper }}"
  register: install_packages_system_bin_file

- name: Clone yay source
  ansible.builtin.git:
    repo: "https://aur.archlinux.org/{{ aur_helper }}.git"
    dest: "{{ aur_helper_dir }}"
  register: install_packages_system_source_cloned
  when: not install_packages_system_bin_file.stat.exists

- name: Build and install yay
  ansible.builtin.command:
    chdir: "{{ aur_helper_dir }}"
    cmd: makepkg -si --noconfirm
    creates: "/usr/bin/{{ aur_helper }}"
  when: not install_packages_system_bin_file.stat.exists

# Cleanup must happen now, before the pkg role runs next; deferring to a
# handler would leave the build dir behind until end of play.
- name: Remove build files for yay
  ansible.builtin.file:
    path: "{{ aur_helper_dir }}"
    state: absent
  when: install_packages_system_source_cloned is changed  # noqa: no-handler

- name: Install AUR package(s)
  ansible.builtin.include_role:
    name: pkg
    tasks_from: aur
  vars:
    pkg_update_cache: true
    pkg_packages:
      - starship # prompt customization
