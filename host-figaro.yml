- name: Setup figaro
  hosts: figaro
  gather_facts: true

  roles:
    - { role: package_handler_settings, tags: package_handler_settings }
    - { role: install_packages_system, tags: install_packages_system }
    - { role: kde, tags: kde }
    - { role: sddm, tags: sddm }
    - { role: install_packages_desktop, tags: install_packages_desktop }
    - { role: ssh, tags: ssh } # put early to allow cloning of github repos with ssh config
    - { role: alacritty, tags: alacritty }
    - { role: avr_dev, tags: avr_dev }
    - { role: bluetooth, tags: bluetooth }
    - { role: claude_code, tags: claude_code }
    - { role: docker, tags: docker }
    - { role: fastfetch, tags: fastfetch }
    - { role: git, tags: git }
    - { role: github_cli, tags: github_cli }
    - { role: keepass, tags: keepass }
    - { role: keyboard_g815, tags: keyboard_g815 }
    - { role: kicad, tags: kicad }
    - { role: lazygit, tags: lazygit }
    - { role: librewolf, tags: librewolf }
    - { role: locale, tags: locale }
    - { role: nix, tags: nix }
    - { role: printer, tags: printer }
    - { role: signal, tags: signal }
    - { role: steam, tags: steam }
    - { role: teams, tags: teams }
    - { role: tmux, tags: tmux }
    - { role: vim, tags: vim }
    - { role: virt_manager, tags: virt_manager }
    - { role: vscodium, tags: vscodium }
    - { role: zsh, tags: zsh }
